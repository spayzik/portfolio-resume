<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#10150f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5a3a"/>
      <stop offset="0.5" stop-color="#b98d5b"/>
      <stop offset="1" stop-color="#6b4a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow1)"/>
  <rect width="1200" height="750" fill="url(#glow2)"/>

  <g transform="translate(80,70)" font-family="Consolas, monospace">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#ffffff" fill-opacity="0.06"/>
    <text x="95" y="20" font-size="13" fill="#fcd34d" text-anchor="middle" letter-spacing="2">ECOMMERCE / WEB</text>
  </g>

  <text x="80" y="400" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="-2">Домэра</text>

  <g font-family="Inter, sans-serif" font-size="20" fill="#94a3b8">
    <text x="80" y="452">Bamboo wall panels · catalog · showroom in Moscow</text>
    <text x="80" y="486">React · Vite · SEO · Web Performance · Lead capture</text>
  </g>

  <g font-family="Consolas, monospace" font-size="16" fill="#64748b">
    <text x="80" y="650" letter-spacing="1">FULL-CYCLE · REQUIREMENTS · FRONTEND · SEO</text>
  </g>
  <rect x="80" y="668" width="460" height="3" rx="1.5" fill="url(#title)" opacity="0.8"/>
</svg>
