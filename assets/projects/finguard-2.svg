    <text x="130" y="46" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="600">API Gateway</text>
    <text x="130" y="74" font-size="13" fill="#64748b" text-anchor="middle">GraphQL</text>

    <rect x="330" y="0" width="260" height="120" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
