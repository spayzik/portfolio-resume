    <line x1="590" y1="60" x2="660" y2="60" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arr)"/>
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
