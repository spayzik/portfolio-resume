<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080C">
<meta name="robots" content="noindex">
<title>404 — Страница не найдена</title>
<meta name="description" content="404: страница не найдена. Вернитесь на главную портфолио Даниила Дунаева.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300D2FF'/%3E%3Cstop offset='1' stop-color='%233A7BD5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='28' font-weight='700' text-anchor='middle' fill='%2308080C'%3Edd%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --bg:            #08080C;
    --bg-soft:       #0B0B10;
    --surface:       rgba(255, 255, 255, 0.035);
    --border:        rgba(255, 255, 255, 0.08);
    --border-hover:  rgba(0, 210, 255, 0.35);
    --text:          #F2F4F8;
    --text-muted:    #AAB2C4;
    --text-dim:      #737B90;
    --accent-1:      #00D2FF;
    --accent-2:      #3A7BD5;
    --accent-3:      #8B5CF6;
    --gradient:      linear-gradient(120deg, var(--accent-1), var(--accent-2));
    --blend-mode:    screen;
    --blob-1-bg:     rgba(0, 210, 255, 0.20);
    --blob-2-bg:     rgba(58, 123, 213, 0.22);
    --blob-3-bg:     rgba(139, 92, 246, 0.16);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    --ease:      cubic-bezier(0.22, 1, 0.36, 1);
}
:root[data-theme="light"] {
    color-scheme: light;
    --bg:            #F4F6FA;
    --bg-soft:       #EDEFF4;
    --surface:       rgba(16, 24, 40, 0.04);
    --border:        rgba(16, 24, 40, 0.10);
    --border-hover:  rgba(0, 120, 180, 0.45);
    --text:          #16181D;
    --text-muted:    #4A5265;
    --text-dim:      #7C8598;
    --accent-1:      #0097C4;
    --accent-2:      #2A6CD6;
    --accent-3:      #6D4AE0;
    --blend-mode:    multiply;
    --blob-1-bg:     rgba(0, 151, 196, 0.11);
    --blob-2-bg:     rgba(42, 108, 214, 0.10);
    --blob-3-bg:     rgba(109, 74, 224, 0.09);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::selection { background: rgba(0, 210, 255, 0.25); }

/* Подложка-сетка */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 72px 72px;
    pointer-events: none;
    z-index: 0;
}
:root[data-theme="light"] body::before {
    background-image:
        linear-gradient(rgba(16,24,40,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16,24,40,0.045) 1px, transparent 1px);
}

/* Aurora */
.aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.aurora .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    mix-blend-mode: var(--blend-mode);
    animation: drift 40s ease-in-out infinite alternate;
}
.blob--1 { width: 52vw; height: 52vw; top: -16%; left: -12%; background: var(--blob-1-bg); }
.blob--2 { width: 46vw; height: 46vw; top: 24%; right: -18%; background: var(--blob-2-bg); animation-delay: -14s; }
.blob--3 { width: 40vw; height: 40vw; bottom: -18%; left: 18%; background: var(--blob-3-bg); animation-delay: -28s; }
@keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(7vw, 6vh) scale(1.18); }
}

/* Шапка-логотип */
.logo-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
.logo-bar .container { width: min(1200px, 92%); margin-inline: auto; display: flex; align-items: center; justify-content: space-between; height: 72px; }
.logo { font-family: var(--font-mono); font-size: 17px; font-weight: 600; letter-spacing: 0.08em; color: var(--text); }
.logo span { color: var(--accent-1); }
.logo-bar .back-link { font-size: 13px; color: var(--text-dim); transition: color 0.3s ease; }
.logo-bar .back-link:hover { color: var(--accent-1); }

/* Контент */
.main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 110px 24px 60px;
    position: relative;
    z-index: 1;
}
.notfound { text-align: center; animation: rise 0.9s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }

.code {
    font-family: var(--font-mono);
    font-size: clamp(96px, 22vw, 220px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.02em;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 10px 40px rgba(0, 210, 255, 0.18));
}
.notfound h1 {
    margin: 22px 0 12px;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    letter-spacing: -0.01em;
}
.notfound p {
    max-width: 460px;
    margin: 0 auto 34px;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
}
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border: 1px solid transparent;
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.3s ease, border-color 0.3s ease;
}
.btn:hover { transform: translateY(-3px); }
.btn--primary { background: var(--gradient); color: #06121A; box-shadow: 0 8px 30px rgba(0, 210, 255, 0.22); }
.btn--primary:hover { box-shadow: 0 14px 44px rgba(0, 210, 255, 0.35); }
.btn--ghost { background: var(--surface); border-color: var(--border); color: var(--text); backdrop-filter: blur(8px); }
.btn--ghost:hover { border-color: var(--border-hover); color: var(--accent-1); }

.footer-line { text-align: center; padding: 26px 16px 30px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.06em; position: relative; z-index: 1; }
.footer-line span { color: var(--accent-1); }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
</div>

<header class="logo-bar">
    <div class="container">
        <a href="index.html" class="logo">dd<span>.</span>dev</a>
        <a href="index.html" class="back-link" data-i18n="back">← index.html</a>
    </div>
</header>

<main class="main">
    <div class="notfound">
        <div class="code">404</div>
        <h1 data-i18n="title">Страница не найдена</h1>
        <p data-i18n="text">Кажется, вы зашли не туда — такой страницы не существует, а может, она переехала. Главная никуда не делась.</p>
        <div class="actions">
            <a href="index.html" class="btn btn--primary" data-i18n="home">На главную</a>
            <a href="index.html#contact" class="btn btn--ghost" data-i18n="contact">Связаться со мной</a>
        </div>
    </div>
</main>

<footer class="footer-line">dd<span>.</span>dev © <span id="year"></span></footer>

<script>
(function () {
    var root = document.documentElement;
    var savedTheme = localStorage.getItem('dd_theme');
    var theme = (savedTheme === 'light' || savedTheme === 'dark')
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    root.dataset.theme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F6FA' : '#08080C');

    var en = localStorage.getItem('dd_portfolio_lang') === 'en';
    var t = {
        title: en ? 'Page not found' : 'Страница не найдена',
        text: en ? 'Looks like you took a wrong turn — this page does not exist or has moved. The homepage is right where it was.' : 'Кажется, вы зашли не туда — такой страницы не существует, а может, она переехала. Главная никуда не делась.',
        home: en ? 'Go home' : 'На главную',
        contact: en ? 'Contact me' : 'Связаться со мной',
        back: en ? '← index.html' : '← index.html'
    };
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
    });
    if (en) { root.lang = 'en'; document.title = '404 — Page not found'; }
    document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
